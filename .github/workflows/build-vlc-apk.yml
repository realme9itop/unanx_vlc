name: Build Unanx VLC
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;25.1.8937393"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "ANDROID_SDK=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Init VLC Gradle environment
        run: |
          # Создаем символическую ссылку на установленный Gradle
          ln -sf $(which gradle) ./gradlew
          chmod +x ./gradlew
          chmod +x buildsystem/compile.sh
          
          # Запускаем инициализацию
          ./buildsystem/compile.sh --init

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unanx-vlc-apk
          path: application/build/outputs/apk/debug/application-debug.apk